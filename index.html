<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TOSM Boss Tracker</title>
<style>
body {
  background: #111;
  color: #fff;
  font-family: Arial, sans-serif;
  margin: 0;
  padding: 15px;
}
input {
  padding: 8px;
  border-radius: 6px;
  border: none;
}
#search {
  width: 100%;
  margin-bottom: 15px;
  box-sizing: border-box;
}
details {
  background: #1c1c1c;
  margin-bottom: 10px;
  border-radius: 10px;
  padding: 10px;
}
summary {
  cursor: pointer;
  font-size: 18px;
  font-weight: bold;
}
.boss-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 8px;
}
.boss-title {
  font-size: 15px;
}
.ch-controls {
  display: flex;
  align-items: center;
  gap: 6px;
}
.ch-controls button {
  background: #1976d2;
  color: white;
  border: none;
  padding: 3px 10px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 16px;
  margin: 0;
}
.ch-controls button.minus {
  background: #c62828;
}
.ch-controls span {
  font-size: 13px;
  color: #aaa;
  min-width: 40px;
  text-align: center;
}
.boss-channels {
  margin-top: 8px;
}
.channel-row {
  background: #2a2a2a;
  padding: 8px 10px;
  margin-top: 6px;
  border-radius: 8px;
  transition: background 0.3s;
}
.channel-label {
  font-size: 12px;
  color: #aaa;
  margin-bottom: 4px;
}
button {
  background: #00c853;
  color: white;
  border: none;
  padding: 8px;
  border-radius: 6px;
  margin-top: 5px;
  cursor: pointer;
  margin-right: 5px;
}
.respawn {
  width: 80px;
}
.timer {
  font-size: 16px;
  font-weight: bold;
  margin-top: 4px;
}
.ready {
  color: #00ff00;
}
</style>
</head>
<body>

<h2>TOSM Boss Tracker</h2>
<input type="text" id="search" placeholder="ค้นหาบอส...">
<div id="app"></div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore, doc, setDoc, getDoc, onSnapshot
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAiotagGj-t2pZzY80CTaHGENlKO086FVU",
  authDomain: "tosm-boss-tracker-11543.firebaseapp.com",
  projectId: "tosm-boss-tracker-11543",
  storageBucket: "tosm-boss-tracker-11543.firebasestorage.app",
  messagingSenderId: "963741009839",
  appId: "1:963741009839:web:addb001d82657ec7af915a",
  measurementId: "G-1CT7C5GKQF"
};

const firebaseApp = initializeApp(firebaseConfig);
const db = getFirestore(firebaseApp);

const data = {
  8:  [["Scorpio",70],["Corrupted",70],["Blut",71],["Nuaele",72],["Dionys",73],["Hauberk",74]],
  9:  [["Chapparition",75],["Devilglove",76],["Salamander",77],["Mineloader",78],["Helgasercle",79]],
  10: [["Glackuman",80],["Fire Lord",81],["Riteris",82],["Naktis",83]],
  11: [["Gaigalas",85],["Tetraox",86],["Kirmeleech",87],["Ferret Marauder",88],["Zaura",89]],
  12: [["Stone Whale",90],["Minotaur",91],["Svitrigaila",92],["Marnox",93]],
  13: [["Colimencia",95],["Sequoia",98],["Neop",101],["Nebulas",103]],
  14: [["Dionia",105],["Ellaganos",107],["Molich",109],["Gazing Golem",111],["Gesti of Destruction",113]],
  15: [["Ironbaum",115],["Diena",118],["Ginklas",120],["Shadowgaler",123]],
  16: [["Crabil",125],["Canceril",128],["Rajatoad",130],["Solcomn",133]],
  17: [["Rafane",135],["Templeshooter",138],["Lucy",140],["Warpulis",143]]
};

const bossChannels = {};
const bossData = {};
const appEl = document.getElementById("app");

function bossKey(ep, bossName) {
  return "EP" + ep + "_" + bossName.replace(/\s/g, '');
}

async function loadSettings() {
  const snap = await getDoc(doc(db, "settings", "bossChannels"));
  if (snap.exists()) {
    Object.assign(bossChannels, snap.data());
  }
  renderBosses();
}

async function saveSettings() {
  await setDoc(doc(db, "settings", "bossChannels"), { ...bossChannels });
}

window.addBossChannel = async function(key) {
  bossChannels[key] = Math.min((bossChannels[key] || 1) + 1, 10);
  await saveSettings();
  renderBosses();
};

window.removeBossChannel = async function(key) {
  bossChannels[key] = Math.max((bossChannels[key] || 1) - 1, 1);
  await saveSettings();
  renderBosses();
};

function renderBosses() {
  appEl.innerHTML = "";

  for (let ep in data) {
    let html = `<details open><summary>Episode ${ep}</summary>`;

    data[ep].forEach(b => {
      const bossName = b[0];
      const level = b[1];
      const key = bossKey(ep, bossName);
      const chCount = bossChannels[key] || 1;

      html += `
        <div data-name="${bossName.toLowerCase()}">
          <div class="boss-header" style="margin-top:10px;">
            <span class="boss-title"><b>${bossName}</b> (Lv.${level})</span>
            <div class="ch-controls">
              <button class="minus" onclick="removeBossChannel('${key}')">−</button>
              <span>CH ${chCount}</span>
              <button onclick="addBossChannel('${key}')">+</button>
            </div>
          </div>
          <div class="boss-channels">`;

      for (let ch = 1; ch <= chCount; ch++) {
        const safeId = bossName.replace(/\s/g, '') + "_EP" + ep + "_CH" + ch;
        html += `
            <div class="channel-row" id="card_${safeId}">
              <div class="channel-label">Channel ${ch}</div>
              Respawn:
              <input class="respawn" type="number" id="respawn_${safeId}" value="120">
              <button onclick="bossDead('${safeId}')">Boss Dead</button>
              <button onclick="resetBoss('${safeId}')">Reset</button>
              <div class="timer" id="timer_${safeId}">00:00:00</div>
            </div>`;
      }

      html += `</div></div>`;
    });

    html += `</details>`;
    appEl.innerHTML += html;
  }

  listenAllBosses();
}

window.bossDead = async function(id) {
  const mins = parseInt(document.getElementById("respawn_" + id).value);
  const spawn = Date.now() + (mins * 60 * 1000);
  await setDoc(doc(db, "bosses", id), { spawn, updated: Date.now() });
};

window.resetBoss = async function(id) {
  await setDoc(doc(db, "bosses", id), { spawn: 0, updated: Date.now() });
};

function listenAllBosses() {
  document.querySelectorAll(".timer").forEach(el => {
    const id = el.id.replace("timer_", "");
    if (bossData[id] !== undefined) return;
    onSnapshot(doc(db, "bosses", id), snapshot => {
      bossData[id] = snapshot.exists() ? snapshot.data().spawn : 0;
    });
  });
}

function updateTimers() {
  document.querySelectorAll(".timer").forEach(el => {
    const id = el.id.replace("timer_", "");
    const spawn = bossData[id];
    const card = document.getElementById("card_" + id);

    if (!spawn || spawn === 0) {
      el.innerHTML = "00:00:00";
      if (card) card.style.background = "#2a2a2a";
      return;
    }

    const diff = spawn - Date.now();

    if (diff <= 0) {
      if (card) card.style.background = "#006400";
      if (!el.dataset.alerted) {
        el.dataset.alerted = "1";
        if (Notification.permission === "granted") {
          new Notification(id + " BOSS READY!");
        }
      }
      el.innerHTML = "<span class='ready'>BOSS READY</span>";
      return;
    }

    el.dataset.alerted = "";
    if (card) card.style.background = diff < 600000 ? "#8B0000" : "#2a2a2a";

    const h = Math.floor(diff / 3600000);
    const m = Math.floor((diff % 3600000) / 60000);
    const s = Math.floor((diff % 60000) / 1000);
    el.innerHTML = String(h).padStart(2, '0') + ":" + String(m).padStart(2, '0') + ":" + String(s).padStart(2, '0');
  });
}

document.getElementById("search").addEventListener("keyup", () => {
  const q = document.getElementById("search").value.toLowerCase();
  document.querySelectorAll("[data-name]").forEach(card => {
    card.style.display = card.dataset.name.includes(q) ? "block" : "none";
  });
});

if ("Notification" in window) Notification.requestPermission();

loadSettings();
setInterval(updateTimers, 1000);

</script>
</body>
</html>
