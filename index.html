const bossData = {};

const app=document.getElementById("app");
  for(let ep in data){

let html=`
<details open>
<summary>Episode ${ep}</summary>
`;

data[ep].forEach(b=>{

const id=b[0].replace(/\s/g,'');

html+=`
<div class="boss" data-name="${b[0].toLowerCase()}" id="card_${id}">
<b>${b[0]}</b> (Lv.${b[1]})<br>

Respawn:
<input
class="respawn"
type="number"
id="respawn_${id}"
value="120">

<button onclick="bossDead('${id}')">
Boss Dead
</button>

<button onclick="resetBoss('${id}')">
Reset
</button>

<div class="timer" id="timer_${id}">
00:00:00
</div>

</div>
`;

});

html+=`</details>`;

app.innerHTML+=html;

}

window.bossDead = async function(id){

let mins=parseInt(
document.getElementById(
"respawn_"+id
).value
);

let spawn=
Date.now()+
(mins*60*1000);

await setDoc(
doc(db,"bosses",id),
{
spawn:spawn,
updated:Date.now()
}
);

};

window.resetBoss = async function(id){

await setDoc(
doc(db,"bosses",id),
{
spawn:0,
updated:Date.now()
}
);

};

document
.querySelectorAll(".timer")
.forEach(el=>{

let id=
el.id.replace("timer_","");

onSnapshot(
doc(db,"bosses",id),
(snapshot)=>{

if(snapshot.exists()){

bossData[id]=
snapshot.data().spawn;

}

});

});function updateTimers(){

document.querySelectorAll(".timer")
.forEach(el=>{

let id=
el.id.replace("timer_","");

let spawn=
bossData[id];

if(!spawn || spawn===0){

el.innerHTML="00:00:00";

return;
}

let diff=
spawn-Date.now();

let card=
document.getElementById(
"card_"+id
);

if(diff<=0){

card.style.background=
"#006400";

if(!el.dataset.alerted){

el.dataset.alerted="1";

if(
Notification.permission
==="granted"
){
new Notification(
id+" BOSS READY!"
);
}

alert(
id+" BOSS READY!"
);

}

el.innerHTML=
"<span class='ready'>BOSS READY</span>";

return;
}

if(diff<600000){

card.style.background=
"#8B0000";

}else{

card.style.background=
"#2a2a2a";

}

let h=
Math.floor(diff/3600000);

let m=
Math.floor(
(diff%3600000)/60000
);

let s=
Math.floor(
(diff%60000)/1000
);

el.innerHTML=
String(h).padStart(2,'0')
+":"
+
String(m).padStart(2,'0')
+":"
+
String(s).padStart(2,'0');

});

}

function filterBosses(){

let q=
document
.getElementById("search")
.value
.toLowerCase();

document
.querySelectorAll(".boss")
.forEach(card=>{

card.style.display=
card.dataset.name
.includes(q)
?
"block"
:
"none";

});

}

if(
"Notification"
in window
){

Notification
.requestPermission();

}

setInterval(
updateTimers,
1000
);

</script>
